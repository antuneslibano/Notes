name: Gerar APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Testes de unidade e APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes de unidade
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Compilar APK
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MinhasNotas.apk

      - name: Guardar APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: MinhasNotas-apk
          path: MinhasNotas.apk

      - name: Relatório dos testes de unidade
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-unidade
          path: app/build/reports/tests/

  ui-tests:
    name: Testes de interface no emulador
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rodar testes no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: chmod +x gradlew && ./gradlew connectedDebugAndroidTest

      - name: Relatório dos testes de interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-interface
          path: app/build/reports/androidTests/

  release:
    name: Publicar em Releases
    needs: [build, ui-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MinhasNotas-apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Minhas Notas 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: MinhasNotas.apk
          body: |
            Baixe o arquivo **MinhasNotas.apk** abaixo pelo celular e abra-o para instalar.
            Pode ser necessário permitir "Instalar apps desconhecidos" para o navegador ou gerenciador de arquivos.
            Esta versão passou nos testes de unidade e nos testes de interface no emulador.
