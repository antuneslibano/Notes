name: Gerar APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk MinhasNotas.apk

      - name: Guardar APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: MinhasNotas-apk
          path: MinhasNotas.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Minhas Notas 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: MinhasNotas.apk
          body: |
            Baixe o arquivo **MinhasNotas.apk** abaixo pelo celular e abra-o para instalar.
            Pode ser necessário permitir "Instalar apps desconhecidos" para o navegador ou gerenciador de arquivos.
